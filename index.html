<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Image</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        .fullscreen-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures image fills screen without distortion */
        }
    </style>
</head>
<body>

<img src="content.jpg" alt="Full Screen Image" class="fullscreen-img">

</body>
</html>
